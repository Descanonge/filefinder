# Project build file

[build-system]
requires = ['setuptools', 'setuptools-scm>=8']
build-backend = 'setuptools.build_meta'
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools_scm]

[project]
dynamic = ['version']

name = 'filefinder'
authors = [
    {name='Clément Haëck', email='clement.haeck@locean.ipsl.fr'}
]
description = 'Find files using a simple syntax.'

readme = 'README.md'
requires-python = '>=3.11'
classifiers = [
    'Development Status :: 4 - Beta',
    'License :: OSI Approved :: MIT License',

    'Programming Language :: Python',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Operating System :: OS Independent',

    'Intended Audience :: Developers',
    'Topic :: Utilities'
]

dependencies = [
]

[project.urls]
'Source' = 'https://github.com/Descanonge/filefinder'
'Documentation' = 'https://filefinder.readthedocs.io'

[dependency-groups]
dev = [
    # lint
    "pyrefly>=1.4.0",
    "ruff>=0.17.3",
    # tests
    "coverage>=7.17.0",
    "hypothesis>=6.170.13",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "tzdata>=2026.6",
    # docs
    "sphinx>=9.0.4",
    "sphinx-autobuild>=2025.8.25",
    "pydata-sphinx-theme>=0.23.0",
    "sphinx-design>=0.8.0",
    "tabulate>=0.10.0",
]

[tool.ruff]
line-length = 88
target-version = 'py311'

[tool.ruff.lint]
select = [
    'ANN',  # flake8-annotations
    'FBT',  # flake8-boolean-trap
    'B',    # flake8-bugbear
    'A',    # flake8-builtins
    'C4',   # flake8-comprehensions
    'FIX',  # flake8-fixme
    'ISC',  # flake8-implicit-str-concat
    'PIE',  # flake8-pie
    'Q',    # flake8-quotes
    'RET',  # flake8-return
    'SIM',  # flake8-simplify
    'ARG',  # flake8-unused-arguments
    'PTH',  # flake8-use-pathlib

    'I',    # isort
    'N',    # pep8-naming
    'E',    # pycodestyle Error
    'W',    # pycodestyle Warning
    'D',    # pydocstyle
    'F',    # Pyflakes
    'PL',   # Pylint
    'UP',   # pyupgrade
    'RUF',  # ruff
]

ignore = [
       'DTZ',  # datetime tz info
       'ANN401', # allow Any types
       'E226', # missing whitespace around arithmetic operator
       'D105', # missing docstring for magical method
       'D204', # one blank line after class
       'D213', # multiline docstring start at 2nd line
       'D417', # not all parameters need doc
       'PLR2004',  # magic values
       'PLR6301',  # no self use
       'SIM108', # ternary if operator
       'RET504', # assignement before return
       'BLE', # blind exceptions
]
unfixable = ["F401"]

exclude = ['docs/source/conf.py']

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"test_*" = ["FBT"]

[tool.ruff.lint.pycodestyle]
max-line-length = 90

[tool.ruff.lint.pydocstyle]
convention = 'numpy'

[tool.ruff.lint.pylint]
max-args = 9

[tool.ruff.format]
quote-style = 'double'

[tool.pyrefly]
preset = "default"
search-path = ["src", "tests"]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
